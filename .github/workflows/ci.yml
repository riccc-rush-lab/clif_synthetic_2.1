name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

jobs:
  # Publication gate (R4, R28). The parameter pack is fitted over
  # MIMIC-IV-Ext-CLIF under a PhysioNet credentialed DUA: fitting locally is
  # permitted, publishing a derived artifact is not until a human records the
  # PhysioNet/MIMIC + Rush compliance review. The acknowledgment (COMPLIANCE_ACK.md)
  # is deliberately local-only — it can carry a reviewer's identity and is
  # gitignored — so CI reads it from the COMPLIANCE_ACK repository secret instead.
  # Set that secret to enforce the gate in CI; when it is absent the gate skips
  # (CI cannot verify a decision it was never given) and the local run stays
  # authoritative.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Compliance acknowledgment must be recorded (or CI secret)
        env:
          CLIFFORGE_COMPLIANCE_ACK: ${{ secrets.COMPLIANCE_ACK }}
        run: uv run python scripts/release_gate.py --skip-if-absent

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync (core + dev + eval)
        # `eval` is required: the evaluation tests import lightgbm / sdmetrics.
        run: uv sync --extra dev --extra eval

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest
